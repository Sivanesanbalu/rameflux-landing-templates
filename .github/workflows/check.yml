name: Validate Frameflux website
on:
  push:
  pull_request:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and Orbit source ZIP
        run: python3 scripts/check_site.py
      - name: Check real motion previews and prompt assets
        run: python3 scripts/check_v5.py
